<li class="watchlist-hover-row">
  <div class="watchlist-hover-row__shell">
    <div class="watchlist-hover-row__quote" [attr.aria-label]="label()">
      <ng-content />
    </div>
    <div class="watchlist-hover-row__actions-slot">
      <div class="watchlist-hover-row__actions" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="watchlist-act watchlist-act--buy"
        [attr.aria-label]="'Buy ' + label()"
        (click)="buy.emit()"
      >
        <span class="watchlist-act__key" aria-hidden="true">B</span>
        <span class="watchlist-act__text">Buy</span>
      </button>
      <button
        type="button"
        class="watchlist-act watchlist-act--sell"
        [attr.aria-label]="'Sell ' + label()"
        (click)="sell.emit()"
      >
        <span class="watchlist-act__key" aria-hidden="true">S</span>
        <span class="watchlist-act__text">Sell</span>
      </button>
      <button
        type="button"
        class="watchlist-act watchlist-act--chart"
        [attr.aria-label]="'Chart ' + label()"
        (click)="chart.emit()"
      >
        <svg class="watchlist-act__chart-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path
            d="M2 12h12M4 10l3-4 2 2 3-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="watchlist-act__text">Chart</span>
      </button>
      </div>
    </div>
  </div>
</li>
