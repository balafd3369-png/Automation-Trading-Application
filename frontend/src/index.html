<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trade with Beast</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    (function () {
      var NAV_KEY = 'twb-app-navigation';
      var h = window.location.hash || '';
      var nav = { centerView: 'market', tradePanelTab: 'paper', marketKind: 'stocks' };
      if (h.indexOf('strategies') !== -1) {
        nav.centerView = 'strategies';
      } else if (h.indexOf('trades/') !== -1) {
        nav.centerView = 'trades';
        var tab = h.match(/trades\/([a-z]+)/);
        if (tab && tab[1]) {
          nav.tradePanelTab = tab[1];
        }
      } else if (h.indexOf('market/options') !== -1) {
        nav.marketKind = 'options';
      } else if (h.length <= 1) {
        try {
          var raw = localStorage.getItem(NAV_KEY);
          if (raw) {
            nav = JSON.parse(raw);
          }
        } catch (e) {}
      }
      window.__TWB_BOOT_NAV__ = nav;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
